<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=" />
  <title>SaIL WebAV</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #ffffff;
      --accent: #2563eb;
      --text: #1d1d1f;
      --muted: #86868b;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 9px 19px 28px 19px;
    }

    .app-shell {
      width: min(800px, 100%);
      display: grid;
      gap: 22px;
    }

    .logo {
      height: 92px;
      width: auto;
      object-fit: contain;
      display: block;
      position: absolute;
      top: 16px;
      left: 20px;
      margin: 0;
    }

    .panel {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .btn-ghost {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease, box-shadow 120ms ease;
    }

    .btn-ghost:hover { background: #f1f5f9; }

    /* 16:9 viewer stage — mirrors the patient monitor's framed display box. */
    .viewer-wrap {
      position: relative;
      padding: 0;
    }

    .viewer {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border: none;
      border-radius: 14px;
      background: #000000;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.16);
    }

    .viewer-fab {
      position: absolute;
      right: 21px;
      bottom: 20px;
      z-index: 2;
      display: flex;
      gap: 8px;
    }

    /* Footer card holding the QR + camera link, matching the monitor footer. */
    .monitor-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 20px 24px;
      background: #f5f5f7;
      border-radius: 22px;
      width: fit-content;
      max-width: 100%;
      justify-self: center;
    }

    .qr-box {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 26px;
      width: 100%;
      flex-wrap: wrap;
    }

    .qr-card {
      background: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 22px rgba(0,0,0,0.10);
    }

    .qr-card img {
      display: block;
      width: 120px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
    }

    .room-info {
      display: grid;
      gap: 12px;
      justify-items: start;
      text-align: left;
      max-width: 360px;
    }

    .room-id {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      background: #ffffff;
      padding: 9px 16px;
      border-radius: 999px;
      border: none;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.4;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
      max-width: 100%;
    }

    .room-id:empty { display: none; }

    .monitor-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      body { padding: 9px 19px 19px 19px; }
      .qr-box { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <img src="SaIL.png" alt="SaIL logo" class="logo" />
    <div class="panel">
      <div class="viewer-wrap">
        <iframe
          id="viewer"
          class="viewer"
          title="Room viewer"
          allow="autoplay *; camera *; microphone *; picture-in-picture *; display-capture *; clipboard-read *; clipboard-write *"
          playsinline
          loading="eager"
        ></iframe>
        <div class="viewer-fab">
          <button id="fsBtn" class="btn-ghost" type="button">Fullscreen</button>
        </div>
      </div>
    </div>

    <div class="panel monitor-footer">
      <div class="qr-box">
        <div class="qr-card"><img id="qr" alt="Scan to send camera" /></div>
        <div class="room-info">
          <div class="room-id" id="joinLink">…</div>
          <div class="monitor-note">Scan the QR code, or open the link above on another device. Multiple devices can join the same session, they'll all appear together on the monitor above.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
  const suppliedRoom = params.get("room");
  // VDO.Ninja requires alphanumeric room codes; 6-char random with r prefix
  const randomCode = Math.random().toString(36).replace(/[^a-z0-9]+/gi, "").slice(2, 8);
  const room = suppliedRoom ? suppliedRoom.replace(/[^a-zA-Z0-9]/g, "") : `r${randomCode}`;
  // Alphanumeric stream ID to avoid landing UI
  const streamId = `${room}cam`;

    if (!suppliedRoom) {
      const next = new URL(window.location.href);
      next.searchParams.set("room", room);
      window.history.replaceState({}, "", next.toString());
    }

    const viewer = document.getElementById("viewer");
    const qr = document.getElementById("qr");
    const joinLinkEl = document.getElementById("joinLink");
    const fsBtn = document.getElementById("fsBtn");

  // Viewer: hide hover controls but keep the big play overlay by using controls=0 (no cleanoutput)
  const viewerUrl = `https://vdo.ninja/?scene&room=${encodeURIComponent(room)}&controls=1&labels=0&stats=0&smallshare&transparent`;
  // Direct room join link for adding devices with desired audio/video params
  // Prevent cameras from seeing other feeds by hiding remote views (view=0)
  // Local join page wrapper (hides vdo.ninja URL) with room param
  const joinPageUrl = new URL("join.html", window.location.href);
  joinPageUrl.searchParams.set("room", room);

  const applyLink = (url) => {
    qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
    joinLinkEl.textContent = url;
  };

  // is.gd JSONP shortener; falls back to the original URL on error/timeout.
  const shortenUrl = (url) => new Promise((resolve) => {
    const cb = `isgd_cb_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const cleanup = () => {
      delete window[cb];
      if (script && script.parentNode) script.parentNode.removeChild(script);
    };
    const script = document.createElement("script");
    window[cb] = (data) => {
      const short = data && data.shorturl;
      resolve(short && short.startsWith("http") ? short : url);
      cleanup();
    };
    script.onerror = () => {
      resolve(url);
      cleanup();
    };
    script.src = `https://is.gd/create.php?format=json&callback=${cb}&url=${encodeURIComponent(url)}`;
    document.body.appendChild(script);
    setTimeout(() => {
      resolve(url);
      cleanup();
    }, 4000);
  });

  viewer.src = viewerUrl;
  const updateFsLabel = () => {
    const active = document.fullscreenElement === viewer || document.fullscreenElement === viewer.parentElement;
    fsBtn.textContent = active ? "Exit fullscreen" : "Fullscreen";
  };

  fsBtn.addEventListener("click", async () => {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        if (viewer.requestFullscreen) {
          await viewer.requestFullscreen();
        } else if (viewer.parentElement?.requestFullscreen) {
          await viewer.parentElement.requestFullscreen();
        }
      }
    } catch (err) {
      console.warn("Fullscreen toggle failed", err);
    } finally {
      updateFsLabel();
    }
  });

  document.addEventListener("fullscreenchange", updateFsLabel);
  updateFsLabel();
  const joinPageHref = joinPageUrl.toString();
  applyLink(joinPageHref); // show immediately with local URL

  shortenUrl(joinPageHref)
    .then((short) => {
      applyLink(short);
    })
    .catch((err) => {
      console.warn("Shorten failed; using full link", err);
      applyLink(joinPageHref);
    });

  </script>
</body>
</html>
